name: Envy checks

on:
  pull_request:
  push:
    branches: [master]

# A new push makes older pull-request runs obsolete.  Cancelling those runs
# keeps the two platform jobs from competing for the same GitHub-hosted
# runners and Nix cache.
concurrency:
  group: envy-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  platform:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            system: aarch64-darwin
          - os: ubuntu-24.04
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The Determinate wrapper always attempts a FlakeHub login.  This
      # repository uses public GitHub inputs and does not need that service,
      # so install regular Nix explicitly and keep authentication out of CI.
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          determinate: false
      # FlakeHub cache requires the repository to be registered with FlakeHub
      # and fails closed for ordinary GitHub repositories.  Magic Nix Cache
      # uses the GitHub Actions cache and does not require that account.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
        if: runner.os != 'macOS'
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
      - name: Evaluate the cross-platform flake
        run: nix flake check path:. --no-build
      - name: Run Envy Python tests
        run: nix build "path:.#checks.${{ matrix.system }}.envy-python-tests"
      - name: Run storage lifecycle integration tests
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.envy-storage-tests"
      - name: Run Rust TUI tests
        run: nix build "path:.#checks.${{ matrix.system }}.envy-tui-tests"
      - name: Run shell checks
        run: nix build "path:.#checks.${{ matrix.system }}.envy-shell-checks"
      - name: Lint Python and Nix
        run: nix build "path:.#checks.${{ matrix.system }}.envy-lint"
      - name: Audit GitHub Actions offline
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.envy-github-actions"
      - name: Run agent tool tests
        run: nix build "path:.#checks.${{ matrix.system }}.envy-agent-tests"
      - name: Run Pi delegated approval regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-auto-assigned-tests"
      - name: Run Pi queue regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-queue-tests"
      - name: Run Pi goal regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-goal-tests"
      - name: Run Pi model and btw regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-model-tests"
      - name: Run Pi subagent regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-subagent-tests"
      - name: Run Pi Agent Doctor regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-doctor-tests"
      - name: Run Pi Python LSP regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-lsp-tests"
      - name: Run Pi context view regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-context-tests"
      - name: Run Pi context view TUI smoke
        run: nix run "path:.#checks.${{ matrix.system }}.pi-context-tests.tui"
      - name: Run Pi diff regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-diff-tests"
      - name: Run Pi diff TUI smoke
        run: nix run "path:.#checks.${{ matrix.system }}.pi-diff-tests.tui"
      - name: Run Pi extension coexistence regressions
        run: nix build --no-link "path:.#checks.${{ matrix.system }}.pi-coexist-tests"
      - name: Run Pi extension coexistence TUI smoke
        run: nix run "path:.#checks.${{ matrix.system }}.pi-coexist-tests.tui"
      - name: Guard encrypted secrets
        run: nix build "path:.#checks.${{ matrix.system }}.secret-safety"
      - name: Check platform option boundaries
        run: nix build "path:.#checks.${{ matrix.system }}.platform-option-boundaries"
      - name: Check Linux desktop/server policy boundaries
        if: matrix.system == 'x86_64-linux'
        run: nix build path:.#checks.x86_64-linux.linux-policy-boundaries

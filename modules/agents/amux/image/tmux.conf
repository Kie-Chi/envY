# amux keeps tmux's default key table (prefix C-b). Only presentation and the
# bindings that must leave the container are changed here.
set -g status off
set -g escape-time 0
set -g history-limit 10000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:clipboard:extkeys:RGB:focus:sync:hyperlinks:usstyle:strikethrough:overline'
set -g window-size latest
set -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#T'

# Show the status line only while a session has more than one window.
set-hook -g window-linked 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'

# Each container owns one session. Session switching is handled by the host
# client, which reads the exit status of the detached tmux client.
bind s detach-client -E 'exit 12'
bind ( detach-client -E 'exit 11'
bind ) detach-client -E 'exit 10'
# The host client attaches to the session named main.
unbind '$'

# Hidden key sent by the host client to detach on hangup.
set -s user-keys[0] "\e[9999~"
bind -n User0 detach-client
